<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pet the Cat</title>
    <link rel="stylesheet" href="/src/styles.css" />
    <script type="module" src="/src/main.ts"></script>
  </head>
  <body>
    <svg class="symbols" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
      <symbol id="moon" viewBox="0 0 24 24"><path d="M19.5 15.5A8.7 8.7 0 0 1 8.5 4.3a8.5 8.5 0 1 0 11 11.2Z" /></symbol>
      <symbol id="sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3.8" /><path d="M12 2v2m0 16v2M2 12h2m16 0h2M4.9 4.9l1.5 1.5m11.2 11.2 1.5 1.5M4.9 19.1l1.5-1.5M17.6 6.4l1.5-1.5" /></symbol>
      <symbol id="full" viewBox="0 0 24 24"><path d="M9 4H4v5m11-5h5v5M4 15v5h5m11-5v5h-5" /></symbol>
      <symbol id="exit" viewBox="0 0 24 24"><path d="M4 9h5V4m6 0v5h5M4 15h5v5m6 0v-5h5" /></symbol>
      <symbol id="speaker" viewBox="0 0 24 24"><path d="M3 9h4l5-4v14l-5-4H3z" /></symbol>
      <symbol id="muted" viewBox="0 0 24 24"><path d="m16 9 5 6m0-6-5 6" /></symbol>
      <symbol id="waves" viewBox="0 0 24 24"><path d="M16 8a6 6 0 0 1 0 8m3-11a10 10 0 0 1 0 14" /></symbol>
      <symbol id="adjust" viewBox="0 0 24 24"><path d="M4 7h5m4 0h7M4 17h10m4 0h2" /><circle cx="11" cy="7" r="2.4" /><circle cx="16" cy="17" r="2.4" /></symbol>
      <symbol id="reload" viewBox="0 0 24 24"><path d="M20 10a8 8 0 1 0-1.5 7M20 4v6h-6" /></symbol>
      <symbol id="small-cat" viewBox="0 0 32 32"><ellipse cx="16" cy="18" rx="5" ry="6" /><path d="m11.5 14 .3-4 2.4 1.4a5 5 0 0 1 3.6 0l2.4-1.4.3 4Z" /></symbol>
      <symbol id="big-cat" viewBox="0 0 32 32"><ellipse cx="16" cy="18" rx="8" ry="9" /><path d="m9 13 .4-6 3.6 2a8 8 0 0 1 4 0l3.6-2 .4 6Z" /></symbol>
      <symbol id="slim-cat" viewBox="0 0 32 32"><ellipse cx="16" cy="18" rx="4.5" ry="9" /><path d="m10.5 13 .4-6 3.6 2a8 8 0 0 1 3 0l3.6-2 .4 6Z" /></symbol>
      <symbol id="wide-cat" viewBox="0 0 32 32"><ellipse cx="16" cy="18" rx="10.5" ry="9" /><path d="m9 13 .4-6 3.6 2a8 8 0 0 1 4 0l3.6-2 .4 6Z" /></symbol>
    </svg>
    <main>
      <section id="viewer" aria-label="撸猫">
        <button id="theme" class="icon-button" role="switch" aria-label="月光模式" aria-checked="false">
          <svg viewBox="0 0 24 24" aria-hidden="true"><use class="moon" href="#moon" /><use class="sun" href="#sun" /></svg>
        </button>
        <div id="stage" tabindex="0" role="group" aria-label="摸摸猫" aria-describedby="gesture" aria-keyshortcuts="Space Enter T">
          <canvas id="scene" aria-hidden="true"></canvas>
          <div id="loading" aria-hidden="true"></div>
          <button id="retry" class="icon-button" aria-label="重新加载" hidden>
            <svg viewBox="0 0 24 24" aria-hidden="true"><use href="#reload" /></svg>
          </button>
        </div>
      </section>
      <div class="toolbar">
        <div class="choices" role="group" aria-label="选择猫咪"></div>
        <div class="tools">
          <button id="proportions-toggle" class="icon-button" aria-label="调整体型" aria-expanded="false" aria-controls="proportions-panel">
            <svg viewBox="0 0 24 24" aria-hidden="true"><use href="#adjust" /></svg>
          </button>
          <div id="proportions-panel" role="group" aria-label="猫咪体型" hidden>
            <div class="proportion-row">
              <svg viewBox="0 0 32 32" aria-hidden="true"><use href="#small-cat" /></svg>
              <input id="cat-size" type="range" aria-label="大小" min="0" max="10" step="1" value="5" />
              <svg viewBox="0 0 32 32" aria-hidden="true"><use href="#big-cat" /></svg>
            </div>
            <div class="proportion-row">
              <svg viewBox="0 0 32 32" aria-hidden="true"><use href="#slim-cat" /></svg>
              <input id="cat-width" type="range" aria-label="胖瘦" min="0" max="10" step="1" value="5" />
              <svg viewBox="0 0 32 32" aria-hidden="true"><use href="#wide-cat" /></svg>
            </div>
          </div>
          <button id="sound" class="icon-button" role="switch" aria-label="呼噜声" aria-checked="false">
            <svg viewBox="0 0 24 24" aria-hidden="true"><use href="#speaker" /><use class="muted" href="#muted" /><use class="waves" href="#waves" /></svg>
          </button>
          <button id="expand" class="icon-button" aria-label="全屏" aria-pressed="false">
            <svg viewBox="0 0 24 24" aria-hidden="true"><use class="full" href="#full" /><use class="exit" href="#exit" /></svg>
          </button>
        </div>
      </div>
      <p id="gesture" class="sr">沿着头和背滑动来抚摸；从尾巴向外拖动可以拉长尾巴，拖回尾根左侧就变成摸背。键盘：空格摸背，T 摸尾巴。</p>
      <p id="notice" class="sr" aria-live="polite" role="status"></p>
    </main>
  </body>
</html>
