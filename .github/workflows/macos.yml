name: macOS build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  dmg:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      - name: Build universal .dmg (ad-hoc signed, not notarized)
        run: npx tauri build --target universal-apple-darwin --bundles app,dmg

      - name: Check bundle
        run: |
          APP="src-tauri/target/universal-apple-darwin/release/bundle/macos/Pet the Cat.app"
          lipo -archs "$APP/Contents/MacOS/pet-the-cat-desktop"
          codesign -dv "$APP" 2>&1 | grep -E "Signature|Identifier"
          ls -lh src-tauri/target/universal-apple-darwin/release/bundle/dmg/

      - uses: actions/upload-artifact@v4
        with:
          name: pet-the-cat-macos-universal
          path: src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
          if-no-files-found: error

      - name: Attach to GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          DMG=(src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg)
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "${DMG[@]}" --clobber
          else
            gh release create "$GITHUB_REF_NAME" "${DMG[@]}" --title "$GITHUB_REF_NAME" --generate-notes
          fi
